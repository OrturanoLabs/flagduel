services:
  app:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      TOLERANCE: ${TOLERANCE:-0.04}
      MAX_PROBES: ${MAX_PROBES:-6}
      STATS_DB_PATH: /app/data/flagduel.sqlite
      STATS_KEY: ${STATS_KEY:-}
    volumes:
      - statistics-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  statistics-data:
